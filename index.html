<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard RITMs</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI';
}

body{
display:flex;
background:#f3f5f7;
}

.sidebar{
width:260px;
height:100vh;
background:#3F005E;
color:white;
padding:25px;
position:fixed;
}

.sidebar h2{
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:15px;
margin-bottom:10px;
background:rgba(255,255,255,.08);
border-radius:10px;
cursor:pointer;
}

.sidebar li:hover{
background:rgba(255,255,255,.2);
}

.main{
margin-left:260px;
padding:30px;
width:100%;
}

.header{
margin-bottom:25px;
}

.header h1{
color:#3F005E;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 3px 8px rgba(0,0,0,.1);
}

.card h3{
font-size:14px;
color:#666;
}

.card .value{
font-size:34px;
font-weight:bold;
color:#3F005E;
margin-top:10px;
}

.graficos{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
margin-bottom:25px;
}

.box{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 3px 8px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#3F005E;
color:white;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<li>📊 Visão Geral</li>

<li>📈 Indicadores</li>
<li>⚙️ Configurações</li>

</ul>

</div>

<div class="main">

<div class="header">

<h1>Status das Entregas</h1>
<p>Dashboard Executivo - RITMs</p>

</div>

<div class="cards">

<div class="card">
<h3>Total RITMs</h3>
<div class="value">173</div>
</div>

<div class="card">
<h3>Produção</h3>
<div class="value">85</div>
</div>

<div class="card">
<h3>Homologação</h3>
<div class="value">5</div>
</div>

<div class="card">
<h3>Backlog</h3>
<div class="value">12</div>
</div>
